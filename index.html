<!DOCTYPE html>
<html lang="en">

<head>
   <title>Smart Notification</title>

   <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #0f172a;
        color: white;
        display: grid;
        place-items: center;
    }

    .container {
        text-align: center;
        padding: 25px;
    }

    h1 {
        color: #38bdf8;
    }

    .buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 25px;
    }

    button {
        padding: 12px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        transition: transform 0.2s, opacity 0.2s;
    }

    button:hover {
        transform: translateY(-3px);
        opacity: 0.85;
    }

    .success-btn {
        background: rgb(0, 252, 55);
        color: rgb(1, 54, 45);
    }

    .warning-btn {
        background: rgb(255, 111, 0);
        color: rgb(69, 0, 0);
    }

    .notification {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: min(340px, calc(100vw - 32px));
        background: #1e293b;
        border: 1px solid #475569;
        border-left: 1px solid #38bdf8;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 10px 35px #0006;
        animation: slideIn 0.35s ease;
        z-index: 10;
    }

    .notification-\.success {
        border-left-color: #22c55e;
    }

    .notification.success {
        border-left-color: #facc15;
    }

    .notification.warning {
        border-left-color: #f87171;
    }

    .notification-content {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 18px;
    }
   </style>
</head>
</html>
